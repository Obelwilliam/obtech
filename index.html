<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1b1a">
<title>Tr Craze Music</title>
<meta property="og:title" content="Tr Craze Music">
<meta property="og:description" content="Listen to Tr Craze Music">
<style>
  :root {
    --bg: #0f1b1a;
    --panel: #172826;
    --line: #27403c;
    --text: #eef5f2;
    --muted: #8fa8a2;
    --accent: #f5c542;
    --accent2: #3fd0c0;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    display: grid;
    place-items: center;
    padding: 24px 16px;
  }
  .player {
    width: 100%;
    max-width: 900px;
    height: min(640px, calc(100vh - 48px));
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 20px;
    overflow: hidden;
  }
  .now {
    padding: 32px 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    border-right: 1px solid var(--line);
  }
  .brand { font-size: 1.4rem; font-weight: 700; letter-spacing: .02em; align-self: flex-start; }
  .record {
    width: clamp(150px, 26vw, 220px); aspect-ratio: 1; border-radius: 50%;
    background:
      radial-gradient(circle at center, var(--bg) 0 7%, var(--accent) 7% 30%, #0a1211 30% 32%, transparent 32%),
      repeating-radial-gradient(circle at center, #0c1514 0 3px, #152221 3px 6px);
    box-shadow: 0 0 0 6px #0c1514, 0 14px 40px rgba(0,0,0,.5);
    animation: spin 6s linear infinite;
    animation-play-state: paused;
  }
  .playing .record { animation-play-state: running; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .meta { text-align: center; min-height: 52px; }
  .meta h2 { font-size: 1.15rem; }
  .meta p { color: var(--muted); font-size: .9rem; margin-top: 4px; }
  .bar { width: 100%; display: grid; gap: 6px; }
  input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; }
  .times { display: flex; justify-content: space-between; color: var(--muted); font-size: .8rem; }
  .controls { display: flex; align-items: center; gap: 18px; }
  button {
    background: none; border: 0; color: var(--text); cursor: pointer;
    display: grid; place-items: center; border-radius: 50%;
  }
  button:focus-visible, li:focus-visible { outline: 2px solid var(--accent2); outline-offset: 3px; }
  .skip { width: 44px; height: 44px; }
  .skip:hover { color: var(--accent); }
  .play { width: 64px; height: 64px; background: var(--accent); color: #1a1500; }
  .play:hover { filter: brightness(1.08); }
  svg { width: 24px; height: 24px; fill: currentColor; }
  .vol { display: flex; align-items: center; gap: 8px; width: 100%; color: var(--muted); }
  .vol svg { width: 18px; height: 18px; flex: none; }
  .list { padding: 20px 0; overflow-y: auto; min-height: 0; }
  .list h3 { padding: 0 24px 12px; font-size: .95rem; color: var(--muted); font-weight: 600; }
  ul { list-style: none; padding: 0; }
  li {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 24px; cursor: pointer; border-left: 3px solid transparent;
  }
  li:hover { background: rgba(255,255,255,.04); }
  li.active { border-left-color: var(--accent); background: rgba(245,197,66,.08); }
  li .n { width: 22px; color: var(--muted); font-size: .85rem; text-align: right; }
  li.active .n { color: var(--accent); }
  li .t { flex: 1; min-width: 0; }
  li .t b { display: block; font-weight: 600; font-size: .95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  li .t span { color: var(--muted); font-size: .8rem; }
  .note { padding: 0 24px; color: var(--accent); font-size: .85rem; min-height: 1.2em; margin-top: 8px; }
  /* Phones and small tablets: stack the player above the playlist */
  @media (max-width: 720px) {
    body { padding: 0; place-items: start center; }
    .player { grid-template-columns: minmax(0, 1fr); height: auto; border-radius: 0; border-width: 0; min-height: 100vh; }
    .now { border-right: 0; border-bottom: 1px solid var(--line); padding: 24px 20px; gap: 16px; }
    .list { overflow: visible; padding-bottom: 32px; }
    li { padding: 14px 20px; }
    .play { width: 72px; height: 72px; }
    .skip { width: 52px; height: 52px; }
  }
  @media (prefers-reduced-motion: reduce) { .record { animation: none; } }
</style>
</head>
<body>
<main class="player" id="player">
  <section class="now">
    <div class="brand">Tr Craze Music</div>
    <div class="record" aria-hidden="true"></div>
    <div class="meta">
      <h2 id="title">Loading…</h2>
      <p id="artist"></p>
    </div>
    <div class="bar">
      <input type="range" id="seek" min="0" max="100" value="0" step="0.1" aria-label="Seek">
      <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
    </div>
    <div class="controls">
      <button class="skip" id="prev" aria-label="Previous track"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button class="play" id="toggle" aria-label="Play"><svg viewBox="0 0 24 24" id="icon"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="skip" id="next" aria-label="Next track"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    </div>
    <label class="vol">
      <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
      <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
    </label>
  </section>
  <section class="list">
    <h3>Playlist</h3>
    <ul id="tracks"></ul>
    <p class="note" id="note"></p>
  </section>
</main>
<audio id="audio" preload="metadata"></audio>

<script>
  // To add a song: upload the file into the "audio" folder, then add one line here.
  var TRACKS = [
    { title: "Bake Wang",                 artist: "TR Craze",                          src: "audio/bake-wang.m4a" },
    { title: "Bulek Ke3 (Junub Sudan)",   artist: "Bulek Ke3 ft. TR Craze",            src: "audio/bulek-ke3.m4a" },
    { title: "Bad News",                  artist: "Lakal 23 x TR Craze",               src: "audio/bad-news.mp3" },
    { title: "Ngath Rodu",                artist: "TR Craze & Lakal 23",               src: "audio/ngath-rodu.m4a" },
    { title: "Madman",                    artist: "TR Craze ft. Jay Hot",              src: "audio/madman.m4a" },
    { title: "Jalä Kä Roda",              artist: "TR Craze",                          src: "audio/jala-ka-roda.mp3" },
    { title: "Jongo",                     artist: "TR Craze",                          src: "audio/jongo.mp3" },
    { title: "Tier Myakuon",              artist: "TR Craze",                          src: "audio/tier-myakuon.mp3" },
    { title: "Tule Tule",                 artist: "TR Craze",                          src: "audio/tule-tule.mp3" },
    { title: "MAMA",                      artist: "TR Craze",                          src: "audio/mama.mp3" },
    { title: "Bol Brown (Bol in Doär Diss)", artist: "TR Craze",                       src: "audio/bol-brown.mp3" },
    { title: "Broke N_gga",               artist: "TR Craze",                          src: "audio/broke.mp3" },
    { title: "CI Nëëy Pööd",              artist: "TR Craze",                          src: "audio/ci-neey-pood.mp3" },
    { title: "Don't Run",                 artist: "TR Craze, Jøe Malø x KGS",          src: "audio/dont-run.mp3" },
    { title: "Gari Gari",                 artist: "TR Craze",                          src: "audio/gari-gari.mp3" },
    { title: "Mar Rom",                   artist: "TR Craze",                          src: "audio/mar-rom.mp3" },
    { title: "Studio Freestyle",          artist: "TR Craze",                          src: "audio/studio-freestyle.mp3" },
    { title: "Cako Cuuc",                 artist: "TR Craze x Jalo Jay",               src: "audio/cako-cuuc.mp3" },
    { title: "Riet Ti Gow",               artist: "TR Craze x Lakal 23",               src: "audio/riet-ti-gow.mp3" }
  ];

  var audio = document.getElementById("audio");
  var player = document.getElementById("player");
  var list = document.getElementById("tracks");
  var seek = document.getElementById("seek");
  var icon = document.getElementById("icon");
  var note = document.getElementById("note");
  var current = 0;
  var PLAY = "M8 5v14l11-7z";
  var PAUSE = "M6 5h4v14H6zM14 5h4v14h-4z";

  function fmt(s) {
    if (!isFinite(s)) return "0:00";
    var m = Math.floor(s / 60), r = Math.floor(s % 60);
    return m + ":" + (r < 10 ? "0" : "") + r;
  }

  function buildList() {
    list.innerHTML = "";
    TRACKS.forEach(function (t, i) {
      var li = document.createElement("li");
      li.tabIndex = 0;
      li.innerHTML = '<span class="n">' + (i + 1) + '</span><div class="t"><b></b><span></span></div>';
      li.querySelector("b").textContent = t.title;
      li.querySelector("span:last-child").textContent = t.artist;
      li.addEventListener("click", function () { load(i, true); });
      li.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); load(i, true); }
      });
      list.appendChild(li);
    });
  }

  function load(i, autoplay) {
    current = (i + TRACKS.length) % TRACKS.length;
    var t = TRACKS[current];
    audio.src = t.src;
    document.getElementById("title").textContent = t.title;
    document.getElementById("artist").textContent = t.artist;
    Array.prototype.forEach.call(list.children, function (li, k) {
      li.classList.toggle("active", k === current);
    });
    note.textContent = "";
    seek.value = 0;
    document.getElementById("cur").textContent = "0:00";
    if ("mediaSession" in navigator && window.MediaMetadata) {
      navigator.mediaSession.metadata = new MediaMetadata({ title: t.title, artist: t.artist, album: "Tr Craze Music" });
    }
    if (autoplay) audio.play().catch(function () {});
  }

  function setPlaying(on) {
    player.classList.toggle("playing", on);
    icon.firstElementChild.setAttribute("d", on ? PAUSE : PLAY);
    document.getElementById("toggle").setAttribute("aria-label", on ? "Pause" : "Play");
  }

  document.getElementById("toggle").addEventListener("click", function () {
    if (audio.paused) audio.play().catch(function () {}); else audio.pause();
  });
  document.getElementById("next").addEventListener("click", function () { load(current + 1, true); });
  document.getElementById("prev").addEventListener("click", function () {
    if (audio.currentTime > 3) audio.currentTime = 0; else load(current - 1, true);
  });
  document.getElementById("vol").addEventListener("input", function (e) { audio.volume = e.target.value; });
  seek.addEventListener("input", function () {
    if (audio.duration) audio.currentTime = (seek.value / 100) * audio.duration;
  });

  audio.addEventListener("play", function () { setPlaying(true); });
  audio.addEventListener("pause", function () { setPlaying(false); });
  audio.addEventListener("ended", function () { load(current + 1, true); });
  audio.addEventListener("loadedmetadata", function () { document.getElementById("dur").textContent = fmt(audio.duration); });
  audio.addEventListener("timeupdate", function () {
    document.getElementById("cur").textContent = fmt(audio.currentTime);
    if (audio.duration) seek.value = (audio.currentTime / audio.duration) * 100;
  });
  audio.addEventListener("error", function () {
    setPlaying(false);
    note.textContent = "Can't load this song. Check the file link in the TRACKS list.";
  });

  if ("mediaSession" in navigator) {
    navigator.mediaSession.setActionHandler("previoustrack", function () { load(current - 1, true); });
    navigator.mediaSession.setActionHandler("nexttrack", function () { load(current + 1, true); });
  }

  audio.volume = 0.8;
  buildList();
  load(0, false);
</script>
</body>
</html>
